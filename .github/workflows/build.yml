name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # لإنشاء Release فيه ملف الـ APK

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: |
          ./gradlew assembleDebug --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk Naffith.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: naffith-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # رابط تحميل مباشر للـ APK (بدون zip): ينشئ Release جديد في كل بناء،
      # والرابط releases/latest/download/Naffith.apk يشير دائماً لآخر نسخة.
      - name: Publish release with APK
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: مرسال 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: Naffith.apk
          body: |
            حمّل `Naffith.apk` وثبّته على الجوال.
            آخر نسخة دائماً على: https://github.com/${{ github.repository }}/releases/latest/download/Naffith.apk

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
